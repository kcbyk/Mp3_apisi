services:
  - type: web
    name: mp3-apisi
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 --threads 8 --timeout 120 -b 0.0.0.0:$PORT api:app
    healthCheckPath: /api/v1/health
